services:
  aura-standalone:
    build: .
    container_name: aura-super-agent
    restart: always
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - AURA_API_KEY=${AURA_API_KEY}
      - QUID_API_URL=${QUID_API_URL}
      - AURA_MODEL=${AURA_MODEL:-hermes3:8b}
      - OLLAMA_OPENAI_URL=${OLLAMA_OPENAI_URL:-http://quid-ollama:11434/v1}
      - DEFAULT_USER_EMAIL=${DEFAULT_USER_EMAIL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - aura-net
      - quid-net

networks:
  aura-net:
    driver: bridge
  quid-net:
    name: quid-proyect_default
    external: true
